[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-workbench-local"
version = "0.1.0"
description = "Evidence-linked research ideation and evaluation workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
pdf = ["pypdf>=6.10,<7"]

[project.scripts]
research-workbench = "research_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["research_workbench*"]

[tool.setuptools.package-data]
research_workbench = ["web/*", "data/*.json"]
